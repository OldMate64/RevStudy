<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitchhiker's Guide to the Apocalypse</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .top-row {
      display: flex;
      width: 100%;
      align-items: flex-start;
    }

    .left-panel {
      flex: 0 0 75%;
      width: 75%;
    }

    .right-panel {
      flex: 0 0 25%;
      width: 25%;
    }

    .left-panel img,
    .right-panel img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin: 20px 0 0 0;
      text-align: left;
      font-size: 2rem;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="top-row">
    <div class="left-panel">
      <img src="4horsemen.png" alt="Four horsemen image" />
      <h1>A Hitchhiker's Guide to the Apocalypse</h1>
    </div>
    <div class="right-panel">
      <img src="7citiesMap.png" alt="Seven cities map" />
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="revstudy.css">
  <title>Hitchhiker's Guide to the Apocalypse</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #ffffff; 
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .top-row {
      display: flex;
      width: 100%;
      align-items: flex-start;
    }

    .left-panel {
      flex: 0 0 75%;
      width: 75%;
    }

    .right-panel {
      flex: 0 0 25%;
      width: 25%;
    }

    .left-panel img,
    .right-panel img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 40px 0 40px 0;
      text-align: center;
      padding: 0 20px;
      font-size: 2em; 
      font-weight: bold; 
      color: #ad0000; 
      margin-bottom: 0px; 
      flex-shrink: 0;
    }

.enter-button {
  display: inline-block;
  padding: 8px 12px;
  background: #ad0000;
  color: #fff;
  text-decoration: none;
  text-align: center;
  border-radius: 6px;
  font-family: Arial, sans-serif;
  font-weight: bold;
}
.enter-button:link,
.enter-button:visited {
  color: #ffffff;
  text-decoration: none;
}

.enter-button:hover,
.enter-button:focus {
  color: #5dccff !important;
  background: #ff0000;
  text-decoration: none;
}

  </style>
</head>
<body>
  <div class="top-row">
    <div class="left-panel">
      <img src="4horsemen.png" alt="Four horsemen image" />
      <h1>A Hitchhiker's Guide to the<br><span style="font-size: 5rem;">Apocalypse</span><br><a href="intro.htm" class="enter-button" style="font-size: 1.5rem;">Enter</a></h1>
      <h1 style="font-size: 1.5rem;">by Les Follent</h1>
    </div>
    <div class="right-panel">
      <img src="7citiesMap.png" alt="Seven cities map" />
    </div>
  </div>
  <div id="orientation-warning-container"></div>
  <script src="include-orientation-warning.js" defer></script>
</body>
</html>

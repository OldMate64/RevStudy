<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="revstudy.css">
    <title>Suggestions</title>
</head>
<body>
    <div style="width: 420px; margin: 0 auto;">
        <div class="suggestions-title" style="padding: 12px 0;">Suggestions</div>

        <form action="https://api.web3forms.com/submit" method="POST" style="display:flex; justify-content:center; align-items:center;">
            <input type="hidden" name="access_key" value="a517bb96-17fd-4782-91f4-48f08e10214e">
            <input type="hidden" name="subject" id="subject" value="Suggestion from Revelation page">

            <p style="text-align:center; font-size:16px; font-family: Arial, Helvetica, sans-serif;">
                Name: <input type="text" name="name" required><br>
                Email: <input type="email" name="email" required><br><br>
                Suggestions for improving the<br>
                page for <span id="pageName"></span>:
                <textarea name="message" required style="width:400px; height:180px; margin: 10px 0; padding: 10px 10px"></textarea><br>
                <button type="submit" style="font-size:16px; font-weight: bold;">Submit</button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button type="button" onclick="window.close()" style="font-size:16px; font-weight: bold;">Close</button>
            </p>
        </form>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const page = params.get("page") || "this page";

        document.getElementById("pageName").textContent = page;
        document.getElementById("subject").value = "Re " + page;
        document.title = page + " - Suggestions";
        document.querySelector(".suggestions-title").textContent = page + " - Suggestions";
    </script>
</body>
</html>
